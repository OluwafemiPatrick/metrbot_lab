name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python 3.11 quality and package smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and development tools
        run: python -m pip install ".[dev]"

      - name: Run tests with coverage
        run: python -m coverage run --branch -m unittest discover -s tests -v

      - name: Enforce coverage threshold
        run: python -m coverage report

      - name: Check formatting
        run: python -m ruff format --check src tests scripts

      - name: Lint source and tests
        run: python -m ruff check src tests scripts

      - name: Type-check production source
        run: python -m mypy

      - name: Compile source and tests
        run: python -m compileall -q src tests scripts

      - name: Check diff whitespace
        run: python scripts/check_diff.py

      - name: Build wheel
        run: python -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist

      - name: Run installed-wheel smoke test outside checkout
        env:
          WHEEL_PATH: ${{ github.workspace }}/dist
        run: |
          set -euo pipefail
          smoke_root="$RUNNER_TEMP/metrbot-lab-installed-smoke"
          smoke_venv="$RUNNER_TEMP/metrbot-lab-installed-venv"
          rm -rf "$smoke_root" "$smoke_venv"
          mkdir -p "$smoke_root"
          python -m venv "$smoke_venv"
          smoke_python="$smoke_venv/bin/python"
          smoke_cli="$smoke_venv/bin/metrbot-lab"
          "$smoke_python" -m pip install --no-index --no-deps "$WHEEL_PATH"/*.whl
          cp data/sample_ohlc.csv "$smoke_root/sample_ohlc.csv"
          (
            cd "$smoke_root"
            "$smoke_cli" --help
            "$smoke_cli" validate --data sample_ohlc.csv
            "$smoke_cli" list-strategies
            "$smoke_cli" backtest --data sample_ohlc.csv --strategy candle_pulse
            test "$(find backtests -type f | wc -l | tr -d ' ')" = "3"
            test "$(find backtests -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')" = "1"
            test "$(find backtests -type f -name summary.json | wc -l | tr -d ' ')" = "1"
            test "$(find backtests -type f -name trades.csv | wc -l | tr -d ' ')" = "1"
            test "$(find backtests -type f -name equity.csv | wc -l | tr -d ' ')" = "1"
          )
