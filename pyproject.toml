[build-system]
requires = ["setuptools>=68,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "metrbot-lab"
dynamic = ["version"]
description = "A deterministic, extensible OHLC backtesting framework."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Metrbot Lab contributors"}]
dependencies = []

[project.scripts]
metrbot-lab = "metrbot_lab.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
]

[tool.setuptools.dynamic]
version = {attr = "metrbot_lab.version.__version__"}

[tool.setuptools]
package-dir = {metrbot_lab = "src", "metrbot_lab.domain" = "src/domain", "metrbot_lab.data" = "src/data", "metrbot_lab.execution" = "src/execution", "metrbot_lab.strategies" = "src/strategies", "metrbot_lab.config" = "src/config", "metrbot_lab.risk" = "src/risk", "metrbot_lab.engine" = "src/engine", "metrbot_lab.reporting" = "src/reporting"}
packages = ["metrbot_lab", "metrbot_lab.domain", "metrbot_lab.data", "metrbot_lab.execution", "metrbot_lab.strategies", "metrbot_lab.config", "metrbot_lab.risk", "metrbot_lab.engine", "metrbot_lab.reporting"]

[tool.setuptools.exclude-package-data]
"*" = ["*.pyc", "__pycache__/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
